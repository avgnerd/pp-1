version: 2
updates:
  # go.mod lives in /backend, not at the repository root.
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      gin-dependencies:
        patterns:
          - "github.com/gin-gonic/*"
          - "github.com/gin-contrib/*"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
