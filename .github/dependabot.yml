version: 2
updates:
  # go.mod lives in /backend, not at the repository root.
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      gin-dependencies:
        patterns:
          - "github.com/gin-gonic/*"
          - "github.com/gin-contrib/*"
      # The golang.org/x modules bump together with the toolchain; one PR per week, not six.
      golang-x:
        patterns:
          - "golang.org/x/*"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      # Keep @videojs/core, react, and hlsjs-video on one version; they must move together.
      videojs:
        patterns:
          - "@videojs/*"
      # Production minor/patch in one PR; majors stay solo. Below videojs because first match wins.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  # Without this entry nothing bumps the action majors the workflows pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
