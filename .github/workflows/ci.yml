name: CI

# Pull requests are checked by pull_request, main by push, and a branch with no pull request
# can be run by hand through workflow_dispatch. A daily schedule re-runs main so an intermittent
# E2E failure surfaces without waiting for the next push.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # 18:37 UTC, off the hour and half hour so the run is not queued behind the peak.
  schedule:
    - cron: "37 18 * * *"

permissions:
  contents: read

jobs:
  verify:
    name: Windows build, tests, and Edge E2E
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show tool versions
        run: |
          go version
          node --version
          npm --version

      - name: Install ffmpeg with libx264
        run: ./scripts/ci/prepare-ffmpeg.ps1

      - name: Build Go packages
        working-directory: backend
        run: go build ./...

      - name: Run Go tests
        working-directory: backend
        run: go test ./... -count=1

      # Dependabot only bumps module versions, so it cannot see a vulnerable standard library
      # in the Go toolchain. govulncheck scans the standard library too and fails only on code
      # the build actually reaches.
      - name: Check Go vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck the frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Copy the frontend into the Go embed directory
        run: ./scripts/ci/embed-frontend.ps1

      - name: Run Edge E2E
        env:
          DVFS_E2E_ARTIFACTS: ${{ runner.temp }}\dvfs-e2e-artifacts
        run: ./scripts/ci/run-e2e.ps1

      # The E2E step fails before this upload, so always() is what keeps the evidence.
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}\dvfs-e2e-artifacts
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
